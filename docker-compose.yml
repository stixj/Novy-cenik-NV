version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: car-rental-price-list
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - TZ=Europe/Prague
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

